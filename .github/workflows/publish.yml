name: Publish to NuGet

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-RC[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.base_ref == 'refs/heads/main'
    environment: nuget

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore src/TypedItem/TypedItem.sln

      - name: Build
        run: dotnet build src/TypedItem/TypedItem.sln --no-restore --configuration Release /p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test src/TypedItem/TypedItem.sln --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/TypedItem/TypedItem.Lib/TypedItem.Lib.csproj --no-build --configuration Release /p:Version=${{ env.VERSION }} --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
